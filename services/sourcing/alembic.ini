# =============================================================================
# Alembic Configuration — AHP Sourcing Engine
# =============================================================================
# This file is read by alembic at runtime.  Key settings:
#   - script_location : points to the migration scripts directory
#   - sqlalchemy.url  : overridden at runtime by env.py from app settings
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# Overridden programmatically in env.py — this is a fallback only.
sqlalchemy.url = postgresql+asyncpg://ahp_user:changeme_in_production@localhost:5432/ahp_sourcing

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
