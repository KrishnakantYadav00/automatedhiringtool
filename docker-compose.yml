# =============================================================================
# Automated Hiring Platform - Docker Compose
# =============================================================================
# Orchestrates all services for local development.
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Follow logs
#   docker compose down -v        # Stop and remove volumes
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Primary data store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ahp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-ahp_sourcing}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ahp_user} -d ${POSTGRES_DB:-ahp_sourcing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ahp-network

  # ---------------------------------------------------------------------------
  # Redis 7 — Caching and job queue broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ahp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ahp-network

  # ---------------------------------------------------------------------------
  # Sourcing Engine — M1 FastAPI service
  # ---------------------------------------------------------------------------
  sourcing:
    build:
      context: ./services/sourcing
      dockerfile: Dockerfile
      target: development
    container_name: ahp-sourcing
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./services/sourcing:/app
    networks:
      - ahp-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  ahp-network:
    driver: bridge
